name: Refresh lab imagery & deploy

# Pulls fresh imagery from each lab site in data/labs.json once a week.
on:
  schedule:
    - cron: "23 7 * * 1"      # Mondays 07:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # a shallow clone cannot rebase onto the updated branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install the checker's dependencies
        run: |
          npm install --no-save --no-audit --no-fund playwright axe-core
          npx playwright install --with-deps chromium

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Crawl lab sites for imagery (headless Chromium)
        continue-on-error: true
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python scripts/crawl_lab_images.py

      - name: Commit refreshed imagery
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gallery.json assets/img
          if git diff --cached --quiet; then
            echo "No image changes."
          else
            git commit -m "chore: refresh lab imagery [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Build the pages from partials/ and pages/
        run: python scripts/build_site.py

      - name: Assemble static site
        run: |
          rm -rf _site && mkdir -p _site
          cp *.html styles.css app.js robots.txt sitemap.xml _site/
          cp -r assets _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      # Blocking on a push (someone is there to fix it); advisory on a schedule,
      # because a site that stops updating is worse than one that updates and
      # files a ticket. --session-storage answers the members' gate, so the sweep
      # measures the pages rather than the modal sitting over them. The runner
      # reaches conductor.nd.edu, so this is the real theme and the real fonts.
      - name: Accessibility and design check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          node scripts/a11y_check.js --root _site
          --session-storage nd_pair_site=1
          ${{ github.event_name == 'schedule' && '--warn-only' || '' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
