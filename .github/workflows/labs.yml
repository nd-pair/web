name: Refresh lab imagery & deploy

# Pulls fresh imagery from each lab site in data/labs.json once a week.
on:
  schedule:
    - cron: "23 7 * * 1"      # Mondays 07:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Crawl lab sites for imagery (headless Chromium)
        continue-on-error: true
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python scripts/crawl_lab_images.py

      - name: Commit refreshed imagery
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gallery.json assets/img
          if git diff --cached --quiet; then
            echo "No image changes."
          else
            git commit -m "chore: refresh lab imagery [skip ci]"
            git push
          fi

      - name: Assemble static site
        run: |
          rm -rf _site && mkdir -p _site
          cp *.html styles.css site.js _site/
          cp -r data _site/
          cp -r assets _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
