name: Accessibility and design check

# The gap this closes: every other workflow here runs on push or on a schedule,
# so until now a pull request reached review unchecked. correll has gated pull
# requests since the review; this brings web level.
on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      warn-only:
        description: "Report problems without failing the job"
        type: boolean
        default: false
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No crawl: a pull request is checked against the data already committed,
      # so the result depends on the change under review and nothing else.
      - name: Build the pages from partials/ and pages/
        run: python3 scripts/build_site.py

      - name: Assemble static site
        run: |
          rm -rf _site && mkdir -p _site
          cp *.html styles.css app.js robots.txt sitemap.xml _site/
          cp -r assets _site/
          touch _site/.nojekyll

      - uses: ./.github/actions/a11y
        with:
          warn-only: ${{ inputs.warn-only || false }}
