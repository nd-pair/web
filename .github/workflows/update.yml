name: Refresh publications & deploy Pages

on:
  schedule:
    - cron: "37 6 * * 1"      # Mondays 06:37 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull publications from OpenAlex
        env:
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO || 'nd-pair@nd.edu' }}
          PUBS_MIN_YEAR: "2016"
        run: python scripts/pull_publications.py

      - name: Commit refreshed publications
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json
          if git diff --cached --quiet; then
            echo "No publication changes."
          else
            git commit -m "chore: refresh publications [skip ci]"
            git push
          fi

      - name: Assemble static site
        run: |
          rm -rf _site && mkdir -p _site
          cp *.html styles.css site.js _site/
          cp -r data _site/
          cp -r assets _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
