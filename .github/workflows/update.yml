name: Refresh site & deploy Pages

on:
  # Every two weeks (1st and 15th, 06:37 UTC).
  schedule:
    - cron: "37 6 1,15 * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # a shallow clone cannot rebase onto the updated branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Refresh roster from robotics.nd.edu (faculty + students + photos)
        env:
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO || 'nd-pair@nd.edu' }}
        run: python scripts/crawl_roster.py

      - name: Pull publications from OpenAlex
        env:
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO || 'nd-pair@nd.edu' }}
          PUBS_MIN_YEAR: "2016"
        run: python scripts/pull_publications.py

      # Build first: the commit below takes the pages along with the data, so
      # the two can never disagree in the tree.
      - name: Build the pages from partials/ and pages/
        run: python scripts/build_site.py

      - uses: ./.github/actions/commit-refresh
        with:
          paths: data assets
          message: "chore: refresh roster, imagery & publications [skip ci]"

      - name: Assemble static site
        run: |
          rm -rf _site && mkdir -p _site
          cp *.html styles.css app.js robots.txt sitemap.xml _site/
          cp -r assets _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      # Blocking on a push (someone is there to fix it); advisory on a schedule,
      # because a site that stops updating is worse than one that updates and
      # files a ticket. The check itself lives in one place now; see
      # .github/actions/a11y.
      - uses: ./.github/actions/a11y
        with:
          warn-only: ${{ github.event_name == 'schedule' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
