name: Refresh site & deploy Pages

on:
  # Every two weeks (1st and 15th, 06:37 UTC).
  schedule:
    - cron: "37 6 1,15 * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # a shallow clone cannot rebase onto the updated branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Refresh roster from robotics.nd.edu (faculty + students + photos)
        env:
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO || 'nd-pair@nd.edu' }}
        run: python scripts/crawl_roster.py

      - name: Pull publications from OpenAlex
        env:
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO || 'nd-pair@nd.edu' }}
          PUBS_MIN_YEAR: "2016"
        run: python scripts/pull_publications.py

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh roster, imagery & publications [skip ci]"
            # The crawls take minutes, so main can move while they run.
            for attempt in 1 2 3; do
              git fetch origin "$GITHUB_REF_NAME"
              git rebase "origin/$GITHUB_REF_NAME" || { git rebase --abort || true; \
                echo "::error::Refresh conflicts with $GITHUB_REF_NAME. Re-run this workflow."; exit 1; }
              python scripts/build_site.py
              git add -A
              git diff --cached --quiet || git commit --amend --no-edit
              git push origin "HEAD:$GITHUB_REF_NAME" && break
              [ "$attempt" = 3 ] && { echo "::error::Could not push the refresh."; exit 1; }
              sleep 5
            done
          fi

      - name: Build the pages from partials/ and pages/
        run: python scripts/build_site.py

      - name: Assemble static site
        run: |
          rm -rf _site && mkdir -p _site
          cp *.html styles.css app.js robots.txt sitemap.xml _site/
          cp -r assets _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
